td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:top}tr[data-id]{cursor:pointer}tr[data-id]:hover td{background:#0f0f0f}tr.bl td{color:#8d8d8d}
.id{font:600 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--pen);white-space:nowrap}

function render(){
 const d=cnt(TASKS,'Done'),i=cnt(TASKS,'Implemented'),b=TASKS.filter(blk).length;
 let h=`<div class="top"><div><h1>Genxi - Build Dashboard</h1><div class="m">Planning dashboard · Tap a phase to see tasks, then a task to copy its start command.</div><div class="lg"><span><b>${d}</b> done</span><span><b>${i}</b> implemented</span><span><b>${TASKS.length-d-i-b}</b> ready</span><span><b>${b}</b> blocked</span></div></div><div class="tot">${Math.round(d/TASKS.length*100)}%</div></div><div class="ops"><div><strong>Stage A · GitHub-first</strong><span>Planned initial mode · not deployed</span></div><div><strong>Stage B · Google Cloud + Firebase</strong><span>Deferred · owner opt-in required</span></div><div><strong>Hybrid controller</strong><span>One active worker · shared checkpoints after migration</span></div></div><div class="grid">`;
 PH.forEach((n,k)=>{const a=TASKS.filter(t=>t.p===k+1),dn=cnt(a,'Done'),o=open.has(k);
  h+=`<article class="ph${o?' open':''}"><button class="hd" data-k="${k}" aria-expanded="${o}"><div class="r"><span class="nm">Phase ${k+1}: ${n}</span><span class="pc">${Math.round(dn/a.length*100)}%</span></div><div class="seg">${a.map(t=>`<i class="${t.st}${blk(t)?' bl':''}" title="${t.id}"></i>`).join('')}</div><div class="m">${a.length} tasks · ${dn} done · ${cnt(a,'Implemented')} implemented · ${a.filter(blk).length} blocked</div></button>`;
  if(o)h+=`<div class="dt"><table><thead><tr><th>ID</th><th>Task</th><th>Model</th><th>Level</th><th>Depends on</th><th>Status</th></tr></thead><tbody>${a.map(t=>`<tr data-id="${t.id}" class="${blk(t)?'bl':''}"><td class="id">${t.id}</td><td>${t.name}${t.blocker?`<div class="m">${t.blocker}</div>`:''}</td><td>${t.model}</td><td>${t.lvl}</td><td class="dp">${t.dep.length?t.dep.map(x=>byId[x].st==='Done'?x:`<u>${x}</u>`).join(', '):'none'}</td><td><span class="pill ${t.st}" title="${t.blocker||''}">${t.st}${blk(t)?' · blocked':''}</span></td></tr>`).join('')}</tbody></table></div>`;
  h+='</article>'});
 document.getElementById('w').innerHTML=h+'</div>';
 document.querySelectorAll('.hd').forEach(e=>e.onclick=()=>{const k=+e.dataset.k;open.has(k)?open.delete(k):open.add(k);render()});
 document.querySelectorAll('tr[data-id]').forEach(e=>e.onclick=()=>copy('Task '+e.dataset.id+' shuru karo'));
}
render();
</script></body></html>
